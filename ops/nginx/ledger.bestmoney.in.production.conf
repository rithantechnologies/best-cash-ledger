# Cash Ledger client VPS - HTTPS production server.
# All 33 account opening balances were explicitly approved as INR 0 at cutover.
# This server block affects ONLY ledger.bestmoney.in; other domains/sites untouched.
server {
    listen 80;
    listen [::]:80;
    server_name ledger.bestmoney.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ledger.bestmoney.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ledger.bestmoney.in;

    ssl_certificate /etc/letsencrypt/live/ledger.bestmoney.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.bestmoney.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Login is intentionally POST-capable; IP rate limited in nginx http context.
    location = /api/auth/login {
        limit_req zone=cashledger_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4001/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicit logout route, allows clearing the HttpOnly session cookie.
    location = /api/auth/logout {
        proxy_pass http://127.0.0.1:4001/api/auth/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
